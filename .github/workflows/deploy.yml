name: Gatsby Deploy

on:
  push:
    branches: master

env:
  # The workflow's own token: it does not expire like a personal access token.
  GH_TOKEN: x-access-token:${{ secrets.GITHUB_TOKEN }}

jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps: 
      - name: GitHub Config
        run: |
          git config --global user.email "rp-cs-ewi@tudelft.nl"
          git config --global user.name "CSE3000-research-project"
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install dependencies
        run: |
          npm install
      # - name: Compress
      #   run: |
      #     pip3 install pillow
      #     npm run compress
      - name: Deploy
        run: npm run deploy:ci
